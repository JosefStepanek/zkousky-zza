<html lang="cs">
<head>

<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>try { var t = localStorage.getItem('zza-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
/* ── Tokeny ──────────────────────────────────────────────
   Papír zdravotnického deníku, inkoust, červená = chyba,
   zelená = správně, jantar = sporné místo, modrá = poznámka z kurzu. */
:root {
  --paper: #F2F4F1;
  --surface: #FFFFFF;
  --sunk: #E8ECE8;
  --ink: #16201C;
  --ink-2: #56635E;
  --ink-3: #86918C;
  --rule: #D6DDD8;
  --rule-strong: #B9C3BD;
  --pen: #C4122F;
  --pen-wash: #FBEAED;
  --ok: #17724A;
  --ok-wash: #E3F2EA;
  --warn: #8F5500;
  --warn-wash: #FAEFD9;
  --warn-rule: #E3B861;
  --note: #1D5BBF;
  --focus: #2F6FDB;
  --shadow: 0 1px 0 rgba(22,32,28,.04), 0 6px 20px -8px rgba(22,32,28,.18);

  --f-display: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Chivo Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem; --s-7: 3rem;
  --r-1: 3px; --r-2: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1311; --surface: #141C19; --sunk: #1A2420;
    --ink: #E2E9E5; --ink-2: #9BA9A3; --ink-3: #6F7D77;
    --rule: #26322D; --rule-strong: #384640;
    --pen: #FF6377; --pen-wash: #3A171E;
    --ok: #52CF8F; --ok-wash: #12301F;
    --warn: #EDB35A; --warn-wash: #30240E; --warn-rule: #7A5A22;
    --note: #86B6FF;
    --focus: #7EA8FF;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1311; --surface: #141C19; --sunk: #1A2420;
  --ink: #E2E9E5; --ink-2: #9BA9A3; --ink-3: #6F7D77;
  --rule: #26322D; --rule-strong: #384640;
  --pen: #FF6377; --pen-wash: #3A171E;
  --ok: #52CF8F; --ok-wash: #12301F;
  --warn: #EDB35A; --warn-wash: #30240E; --warn-rule: #7A5A22;
  --note: #86B6FF;
  --focus: #7EA8FF;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* ── Základ ── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1rem/1.55 var(--f-body);
  padding-inline: 16px;
  padding-block: 0;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-1); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.shell { max-width: 44rem; margin-inline: auto; padding-block: var(--s-4) var(--s-7); }

/* ── Typografie ── */
.eyebrow { font: 600 .6875rem/1.2 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
h2 { font-size: 1.25rem; font-weight: 600; line-height: 1.2; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .8125rem; }
p { margin: 0; }

/* ── Ikony (Lucide) ── */
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.with-ic { display: flex; align-items: center; gap: .5rem; }
.with-ic .ic { width: 1.1em; height: 1.1em; }
.btn .ic { width: 1.125rem; height: 1.125rem; }
.opts.tf .opt .ic { width: 1.5rem; height: 1.5rem; stroke-width: 2.5; }
.opts.tf .txt { display: flex; align-items: center; gap: var(--s-2); }

/* ── Animace (jen když systém nežádá omezení pohybu) ── */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes riseSoft { from { opacity: .4; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes heroPop { 0% { opacity: 0; transform: scale(.3) rotate(-25deg); } 60% { opacity: 1; transform: scale(1.18) rotate(8deg); } 100% { opacity: 1; transform: none; } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
@keyframes bdgIn { from { opacity: 0; transform: translateY(10px) scale(.9); } }
@keyframes okFlash { from { background: color-mix(in srgb, var(--ok) 45%, var(--surface)); } }
@keyframes badFlash { from { background: color-mix(in srgb, var(--pen) 40%, var(--surface)); } }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.2) rotate(-8deg); } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes grow { from { width: var(--from, 0%); } }
@keyframes fill { from { width: 0; } }
@keyframes stamp { 0% { opacity: 0; transform: rotate(-4deg) scale(1.7); } 70% { opacity: 1; transform: rotate(-4deg) scale(.94); } 100% { opacity: 1; transform: rotate(-4deg) scale(1); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }
@media (prefers-reduced-motion: no-preference) {
  .enter .home > *, .enter .result > *, .enter > .top { animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }
  .enter .quiz > * { animation: riseSoft .34s cubic-bezier(.2,.7,.3,1) both; }
  .enter .home > :nth-child(2), .enter .quiz > :nth-child(2), .enter .result > :nth-child(2) { animation-delay: .07s; }
  .enter .home > :nth-child(3), .enter .quiz > :nth-child(3), .enter .result > :nth-child(3) { animation-delay: .14s; }
  .enter .home > :nth-child(4), .enter .result > :nth-child(4) { animation-delay: .21s; }
  .enter .home > :nth-child(5), .enter .result > :nth-child(5) { animation-delay: .28s; }
  .enter .home > :nth-child(n+6), .enter .result > :nth-child(n+6) { animation-delay: .35s; }
  .enter .hero-ic { animation: heroPop .7s cubic-bezier(.3,1.5,.5,1) .15s both; }
  .enter .hero[data-tier="top"] .hero-ic .ic { animation: wiggle .5s ease-in-out .9s 3; }
  .enter .bdg { animation: bdgIn .45s cubic-bezier(.2,.7,.3,1) .8s both; }
  .enter .bdg:nth-child(2) { animation-delay: .95s; }
  .enter .bdg:nth-child(3) { animation-delay: 1.1s; }
  .enter .streak .ic { animation: flicker .9s ease-in-out .5s 3; }
  .flash-ok .is-right { animation: okFlash .9s ease-out; }
  .flash-bad .is-wrong { animation: badFlash .9s ease-out, shake .42s ease-in-out; }
  .run.bump { animation: pop .4s ease-out; }
  .enter .meter > i { animation: fill 1s cubic-bezier(.2,.7,.3,1) .15s both; }
  .opt.just .box, .ofig.just .box, .opts.tf .opt.just { animation: pop .26s ease-out; }
  .verdict[data-ok="1"] .ic { animation: pop .4s ease-out; }
  .verdict[data-ok="0"] { animation: shake .42s ease-in-out; }
  .explain { animation: rise .3s ease-out both; }
  .progress i { animation: grow .45s cubic-bezier(.2,.7,.3,1); }
  .stampbig { animation: stamp .5s cubic-bezier(.2,.7,.3,1) .45s both; }
  .toast { animation: toastIn .2s ease-out; }
}

/* ── Hlavička ── */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); padding-block: var(--s-3); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
.cross { width: 26px; height: 26px; flex: none; }
.brand-name { font: 700 1.25rem/1 var(--f-display); }
.brand-sub { font: 600 .625rem/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

/* ── Tlačítka ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 48px; padding: 0 var(--s-5);
  border: 1px solid var(--rule-strong); border-radius: var(--r-2);
  background: var(--surface); cursor: pointer;
  font-weight: 600; font-size: .9375rem; text-decoration: none; text-align: center;
  transition: background .15s, border-color .15s, transform .08s;
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-primary:disabled { background: var(--sunk); color: var(--ink-3); border-color: var(--rule); cursor: not-allowed; }
.btn-ghost { background: transparent; border-color: transparent; padding-inline: var(--s-3); color: var(--ink-2); min-height: 40px; }
.btn-ghost:hover { color: var(--ink); border-color: transparent; background: var(--sunk); }
.btn-block { width: 100%; }

/* ── Měřidlo připravenosti s čarou 82 % ── */
.meter { position: relative; height: 10px; background: var(--sunk); border-radius: 99px; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 99px; transition: width .4s; }
.meter[data-pass="1"] > i { background: var(--ok); }
.meter .tick { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--pen); left: 82%; }
.meter-labels { display: flex; justify-content: space-between; margin-top: var(--s-2); font: 500 .75rem/1 var(--f-mono); color: var(--ink-3); position: relative; }
.meter-labels .t82 { position: absolute; left: 82%; transform: translateX(-50%); color: var(--pen); }

/* ── Domov ── */
.home { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-6); padding-top: var(--s-5); }
.exam-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-2); box-shadow: var(--shadow); padding: var(--s-5); display: grid; gap: var(--s-4); }
.exam-card h1 { max-width: 20ch; }
.exam-facts { display: flex; gap: var(--s-5); flex-wrap: wrap; }
.fact b { display: block; font: 600 1.5rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.fact span { font-size: .8125rem; color: var(--ink-2); }
.fact.pass b { color: var(--pen); }
.last-exam { font-size: .875rem; color: var(--ink-2); }
.last-exam strong { color: var(--ink); font-family: var(--f-mono); }

.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(13.5rem, 100%), 1fr)); gap: var(--s-3); }
.mode {
  text-align: left; cursor: pointer; background: transparent;
  border: 1px solid var(--rule-strong); border-radius: var(--r-2);
  padding: var(--s-4); display: grid; gap: var(--s-1); align-content: start;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.mode:hover { border-color: var(--ink-2); background: var(--surface); }
.mode:not(.mode-wide):hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.mode-head { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-1); }
.mode-ic { width: 2.25rem; height: 2.25rem; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); color: var(--ink); flex: none; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.mode-ic .ic { width: 1.25rem; height: 1.25rem; }
.mode-ic.ok { background: var(--ok-wash); color: var(--ok); }
.mode:hover .mode-ic { transform: rotate(-8deg) scale(1.08); }
.mode-last { display: flex; align-items: center; gap: 6px; margin-top: var(--s-2); font: 500 .6875rem/1.3 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mode-last .ic { width: .875rem; height: .875rem; }
.mode-last b { color: var(--ink-2); font-weight: 600; }
.mode-lasts { display: flex; flex-wrap: wrap; gap: 0 var(--s-5); }
.mode-wide { grid-column: 1 / -1; cursor: default; background: var(--surface); }
.mode-wide:hover { border-color: var(--rule-strong); }
.mode-btns { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-2); }
.mode-btns .btn { flex: 1 1 10rem; min-height: 44px; }
.mode-title { font: 600 1.0625rem/1.2 var(--f-display); display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); flex: 1; min-width: 0; }
.mode-title .badge { font: 600 .75rem/1 var(--f-mono); padding: 3px 6px; border-radius: var(--r-1); background: var(--sunk); color: var(--ink-2); align-self: center; white-space: nowrap; }
.mode-title .badge.hot { background: var(--pen-wash); color: var(--pen); }
.mode-desc { font-size: .8125rem; color: var(--ink-2); line-height: 1.4; }

.install { display: flex; gap: var(--s-3); align-items: flex-start; justify-content: space-between; border: 1px dashed var(--rule-strong); border-radius: var(--r-2); padding: var(--s-3) var(--s-4); font-size: .875rem; line-height: 1.5; }
.install > div { display: grid; gap: var(--s-2); }
.install .btn-primary { justify-self: start; min-height: 40px; }

.readiness { display: grid; gap: var(--s-3); }
.readiness-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); }
.readiness-head .num { font-size: 1.125rem; font-weight: 600; }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); padding-bottom: var(--s-2); border-bottom: 1px solid var(--ink); margin-bottom: var(--s-1); }

.topics { list-style: none; margin: 0; padding: 0; }
.topic { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--s-2) var(--s-4); padding: var(--s-3) var(--s-1); cursor: pointer; text-align: left; }
.topic:hover { background: var(--surface); }
.topic-main { display: flex; align-items: center; flex-wrap: wrap; gap: 0 var(--s-2); }
.topic-ic { color: var(--ink-3); display: inline-flex; transition: color .15s; }
.topic:hover .topic-ic { color: var(--ink); }
.topic-name { font-weight: 500; }
.topic-pages { font: 500 .75rem/1 var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.topic-stat { font: 500 .8125rem/1 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.boxes { grid-column: 1 / -1; display: flex; height: 4px; gap: 2px; }
.boxes i { display: block; flex: 1; height: 100%; border-radius: 1px; background: var(--sunk); }
.boxes i[data-b="1"] { background: var(--pen); opacity: .55; }
.boxes i[data-b="2"] { background: var(--warn-rule); }
.boxes i[data-b="3"] { background: var(--ok); opacity: .55; }
.boxes i[data-b="4"] { background: var(--ok); opacity: .8; }
.boxes i[data-b="5"] { background: var(--ok); }
.legend { display: flex; gap: var(--s-4); flex-wrap: wrap; font-size: .75rem; color: var(--ink-2); margin-top: var(--s-3); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 4px; margin-right: 6px; vertical-align: middle; border-radius: 1px; background: var(--c); opacity: var(--o, 1); }

.cover { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.75rem, 1fr)); gap: 4px; margin-top: var(--s-3); }
.pg { border: 1px solid var(--rule); border-radius: var(--r-1); background: var(--surface); padding: 6px 7px 7px; display: grid; gap: 2px; min-height: 3.9rem; align-content: space-between; cursor: pointer; text-align: left; }
.pg:hover { border-color: var(--ink-2); }
.pg b { font: 600 .75rem/1 var(--f-mono); }
.pg span { font-size: .625rem; line-height: 1.2; color: var(--ink-2); overflow-wrap: anywhere; }
.pg em { font: 500 .5625rem/1.2 var(--f-mono); font-style: normal; color: var(--ok); }
.cover-note { font-size: .8125rem; color: var(--ink-2); margin-top: var(--s-3); max-width: 65ch; }

.foot { display: flex; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; font-size: .75rem; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: var(--s-4); }
.foot button { background: none; border: 0; color: var(--ink-3); text-decoration: underline; cursor: pointer; padding: 0; font-size: .75rem; }

/* ── Kvíz ── */
.quiz { padding-top: var(--s-3); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-4); }
.qbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.qbar-mid { flex: 1; display: grid; gap: 6px; min-width: 0; }
.qbar-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); font: 500 .75rem/1 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .25s; }

.qcard { display: grid; gap: var(--s-4); }
.qmeta { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.stamp { font: 600 .6875rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 2px; padding: 4px 6px 3px; color: var(--ink-2); }
.stamp.warn { color: var(--warn); }
.qtext { font: 600 1.3125rem/1.35 var(--f-display); text-wrap: pretty; }
@media (min-width: 560px) { .qtext { font-size: 1.4375rem; } }
.qhint { font-size: .8125rem; color: var(--ink-2); margin-top: calc(-1 * var(--s-2)); }
.qhint b { color: var(--ink); font-weight: 600; }

/* Písmeno možnosti v kolečku (jedna odpověď) nebo čtverečku (víc odpovědí) */
.box {
  width: 1.625rem; height: 1.625rem; flex: none;
  display: grid; place-items: center;
  border: 1.5px solid var(--rule-strong); background: var(--surface);
  color: var(--ink-2); font: 600 .75rem/1 var(--f-mono);
  transition: background .12s, border-color .12s, color .12s;
}
.box.radio { border-radius: 50%; }
.box.check { border-radius: 5px; }

.opts { display: grid; border-top: 1px solid var(--rule); }
.opt {
  display: grid; grid-template-columns: 1.625rem 1fr auto; gap: var(--s-3); align-items: center;
  width: 100%; text-align: left; cursor: pointer; background: transparent; border: 0; border-bottom: 1px solid var(--rule);
  padding: var(--s-3) var(--s-2); min-height: 3.25rem; font-size: 1rem; line-height: 1.4; transition: background .12s;
}
.opt:hover:not([disabled]) { background: var(--surface); }
.opt[disabled] { cursor: default; }
.opt[aria-pressed="true"] { background: var(--surface); }
.opt[aria-pressed="true"] .box, .ofig[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.opt.is-right, .ofig.is-right { background: var(--ok-wash); }
.opt.is-wrong, .ofig.is-wrong { background: var(--pen-wash); }
.opt.is-right .box, .ofig.is-right .box { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.is-wrong .box, .ofig.is-wrong .box { background: var(--pen); border-color: var(--pen); color: var(--surface); }

/* Pravda / mýtus */

.figure { margin: 0; border: 1px solid var(--rule); border-radius: var(--r-2); background: var(--surface); padding: var(--s-3); display: grid; gap: var(--s-2); justify-items: center; }

.fx-b { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

/* Seřaď */
.ord { display: grid; gap: var(--s-3); }
.ord-list, .ord-pool { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ord-item, .ord-pool-item {
